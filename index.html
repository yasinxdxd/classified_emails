body{font:14px/1.45 system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1d2330}

main{padding:16px 20px;max-width:1100px}
.card{background:#fff;border:1px solid #e1e4ea;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.featured{border-left:5px solid #d4a017}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.uni{font-weight:600;font-size:15px}
.meta{color:#5d6576;font-size:12.5px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;margin-right:4px}
.positive{background:#dff3e4;color:#1b6b34}.info_request{background:#e0ecfb;color:#1d4f91}
.redirect{background:#efe6fb;color:#5b2d91}.negative{background:#fbe2e2;color:#9a2323}
.auto_reply,.other{background:#eceef2;color:#4a5160}.bounce{background:#fff0d9;color:#8a5300}
.star{background:#fff4cc;color:#7a5b00}
.summary{margin:8px 0 4px}.next{color:#1b6b34;margin:2px 0}
details{margin-top:6px}summary{cursor:pointer;color:#3b4a6b}

.decide{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.decide button{border:1px solid #c8cdd8;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
.decide button.on{background:#1d2330;color:#fff;border-color:#1d2330}
.decide input{flex:1;min-width:200px;padding:4px 8px;border:1px solid #c8cdd8;border-radius:6px}
.stats{color:#c9d1e3;font-size:12.5px;margin-left:auto}

#err{color:#9a2323;min-height:1.2em}
nav a{cursor:pointer}
.hint{font-size:12px;color:#5d6576}

const STORE = "triage-decisions";
let rows = [], state = {tab: "featured", q: "", decision: "", sort: "interest"};

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function decrypt(password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BLOB.iv)}, key, b64(BLOB.data));
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(text);
}

async function unlock(password) {
  try {
    rows = await decrypt(password);
  } catch (e) {
    document.getElementById("err").textContent = "Wrong password";
    return;
  }
  const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
  for (const r of rows) if (saved[r.id]) Object.assign(r, saved[r.id]);
  document.getElementById("pw").value = "";
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  render();
}

function save(r) {
  const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
  saved[r.id] = {decision: r.decision, notes: r.notes};
  localStorage.setItem(STORE, JSON.stringify(saved));
}

    (state.tab === "all" || (state.tab === "featured" ? r.featured : r.category === state.tab)) &&
    (!state.decision || r.decision === state.decision) &&
    (!q || [r.university, r.country, r.from_addr, r.summary, r.body].some(v => (v || "").toLowerCase().includes(q))));
  const by = {
    interest: (a, b) => (b.interest || 0) - (a.interest || 0) || (b.reputation || 0) - (a.reputation || 0) || (b.date || "").localeCompare(a.date || ""),
    reputation: (a, b) => (b.reputation || 0) - (a.reputation || 0) || (b.interest || 0) - (a.interest || 0),
    date: (a, b) => (b.date || "").localeCompare(a.date || ""),
    university: (a, b) => (a.university || "").localeCompare(b.university || ""),
  }[state.sort];
  return list.sort(by);
}

function card(r) {
  const cat = r.category || "other";
  let badges = (r.featured ? '<span class="badge star">★ Featured</span>' : "") +
    `<span class="badge ${cat}">${esc(CATEGORIES[cat] || cat)}</span>`;
  if (r.category && r.category !== "bounce")
    badges += `<span class="meta">interest ${r.interest}/10 · reputation ${r.reputation}/5</span>`;
  let info = "";
  if (cat === "bounce") info = `<div class="summary">Failed recipient: <b>${esc(r.bounced_addr || "?")}</b></div>`;
  else if (r.summary) info = `<div class="summary">${esc(r.summary)}</div><div class="next">→ ${esc(r.next_step)}</div>` +
    (r.contact_person ? `<div class="meta">Contact: ${esc(r.contact_person)}</div>` : "") +
    `<div class="meta">Why: ${esc(r.reason)} · Language: ${esc(r.language)}</div>`;
  const buttons = DECISIONS.map(d =>
    `<button type="button" data-id="${r.id}" data-d="${d}" class="${r.decision === d ? "on" : ""}">${d}</button>`).join("");
  return `<div class="card${r.featured ? " featured" : ""}">
    <div class="top"><div><div class="uni">${esc(r.university || "(university not matched)")} <span class="meta">${esc(r.country)}</span></div>
    <div class="meta">${esc(r.from_name)} &lt;${esc(r.from_addr)}&gt; · ${esc((r.date || "").slice(0, 16).replace("T", " "))}</div></div>
    <div>${badges}</div></div>
    <div class="meta"><b>${esc(r.subject)}</b></div>${info}
    <details><summary>Show their reply</summary><pre>${esc(r.reply_text || r.body)}</pre>
    <details><summary>Full message incl. quoted text</summary><pre>${esc(r.body)}</pre></details></details>
    <div class="decide">${buttons}<input data-notes="${r.id}" placeholder="notes" value="${esc(r.notes)}"></div></div>`;
}

function render() {
  const count = t => t === "all" ? rows.length : rows.filter(r => t === "featured" ? r.featured : r.category === t).length;
  document.getElementById("nav").innerHTML = TABS.map(([t, label]) =>
    `<a data-tab="${t}" class="${t === state.tab ? "on" : ""}">${label} (${count(t)})</a>`).join("");
  const n = d => rows.filter(r => r.decision === d).length;
  document.getElementById("stats").textContent = `to contact: ${n("contact")} · refuse: ${n("refuse")} · later: ${n("later")}`;
  const list = visible();
  document.getElementById("count").textContent = `${list.length} shown`;
  document.getElementById("list").innerHTML = list.map(card).join("") || "<p>No messages here.</p>";
}

function downloadCsv() {
  const cols = ["date","university","country","from_name","from_addr","category","featured","interest","reputation",
                "decision","summary","next_step","contact_person","notes","bounced_addr","subject"];
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [cols.join(",")].concat(visible().map(r => cols.map(c => q(r[c])).join(","))).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], {type: "text/csv"}));
  a.download = "triage_export.csv";
  a.click();
}

document.getElementById("lf").onsubmit = e => { e.preventDefault(); unlock(document.getElementById("pw").value); };
document.getElementById("nav").onclick = e => { const t = e.target.dataset.tab; if (t) { state.tab = t; render(); } };
document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
const ds = document.getElementById("decision");
DECISIONS.forEach(d => ds.add(new Option(d, d)));
ds.onchange = e => { state.decision = e.target.value; render(); };
document.getElementById("csv").onclick = downloadCsv;
document.getElementById("list").onclick = e => {
  const b = e.target.closest("button[data-d]");
  if (!b) return;
  const r = rows.find(x => x.id == b.dataset.id);
  r.decision = b.dataset.d; save(r); render();
};
document.getElementById("list").onchange = e => {
  const id = e.target.dataset.notes;
  if (!id) return;
  const r = rows.find(x => x.id == id);
  r.notes = e.target.value; save(r);
};
document.getElementById("lock").onclick = () => location.reload();  // drops decrypted data from memory
</script></body></html>
